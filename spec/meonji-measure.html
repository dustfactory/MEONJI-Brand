<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEONJI 로고 측정 도구</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--fg:#1d2027;--mut:#6b7280;--bd:#e3e5ea;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--paper:#ffffff;--tool:#2563eb;--std:#e11d48;--meas:#0891b2;--ms:#f59e0b}
:root[data-theme=dark]{--bg:#121418;--panel:#1b1e24;--fg:#e8eaee;--mut:#9aa1ad;--bd:#2c313a;--ac:#60a5fa;--paper:#f2f2ef;--tool:#3b82f6}
*{box-sizing:border-box}html,body{margin:0;height:100%;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
#app{display:grid;grid-template-columns:1fr 330px;grid-template-rows:48px 1fr 28px;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--bd);overflow-x:auto}
header h1{font-size:14px;margin:0 8px 0 2px;white-space:nowrap}
.sep{width:1px;height:24px;background:var(--bd);margin:0 4px}
button,select,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--bd);border-radius:7px;padding:5px 9px}
button{cursor:pointer;white-space:nowrap}button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
kbd{font-size:10px;opacity:.7;margin-left:3px;border:1px solid currentColor;border-radius:3px;padding:0 3px}
#stageWrap{position:relative;overflow:hidden;background:repeating-conic-gradient(var(--bd) 0 25%,transparent 0 50%) 0 0/20px 20px}
#stage{width:100%;height:100%;display:block;touch-action:none;cursor:default}
#stage.pan{cursor:grab}#stage.panning{cursor:grabbing}#stage.cross{cursor:crosshair}
aside{background:var(--panel);border-left:1px solid var(--bd);overflow-y:auto;padding:10px 12px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:14px 0 6px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0;flex-wrap:wrap}.row label{display:flex;align-items:center;gap:4px}
.row input[type=number]{width:74px}.row input[type=range]{width:110px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 4px;border-bottom:1px solid var(--bd);text-align:right}td:first-child,th:first-child{text-align:left}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
#mlist div{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd)}#mlist button{padding:1px 7px}
footer{grid-column:1/3;display:flex;gap:16px;align-items:center;padding:0 10px;background:var(--panel);border-top:1px solid var(--bd);font-variant-numeric:tabular-nums;color:var(--mut);font-size:12px}
#loupe{position:absolute;width:150px;height:150px;border-radius:50%;border:2px solid var(--ac);overflow:hidden;pointer-events:none;display:none;background:var(--paper);box-shadow:0 4px 18px #0004}
#loupe svg{width:100%;height:100%}
#readout{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-variant-numeric:tabular-nums;pointer-events:none;box-shadow:0 2px 8px #0002;min-width:160px}
#readout b{font-size:15px}
#drop{position:absolute;inset:0;border:3px dashed var(--ac);background:#2563eb22;display:none;align-items:center;justify-content:center;font-size:18px;pointer-events:none}
.hint{color:var(--mut);font-size:11.5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle}
svg text{font-family:inherit;font-variant-numeric:tabular-nums}
</style></head><body>
<div id="app">
<header>
 <h1>먼지 로고 측정</h1>
 <button data-logo="symbol" class="on">심볼</button><button data-logo="wordmark">워드마크</button><button data-logo="custom" id="customTab" style="display:none">불러온 파일</button>
 <button id="openBtn">파일 열기…</button><input type="file" id="file" accept=".svg,image/svg+xml,image/png,image/jpeg" hidden>
 <span class="sep"></span>
 <button data-tool="ruler">자<kbd>R</kbd></button><button data-tool="pro">각도기<kbd>P</kbd></button>
 <button data-mode="dist">거리 측정<kbd>M</kbd></button><button data-mode="angle">3점 각도<kbd>A</kbd></button>
 <span class="sep"></span>
 <button id="gridBtn">격자<kbd>G</kbd></button><button id="fitBtn">화면 맞춤<kbd>F</kbd></button>
 <button id="zin">＋</button><button id="zout">－</button>
 <span class="sep"></span><button id="themeBtn">🌓</button>
</header>
<div id="stageWrap">
 <svg id="stage" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="nc"><rect/></clipPath></defs>
  <g id="world"><g id="content"><rect id="paper"/><g id="logo"></g><g id="ov"></g></g><g id="tools"></g></g>
 </svg>
 <div id="readout"></div>
 <div id="loupe"><svg xmlns="http://www.w3.org/2000/svg"><use href="#content"/><g id="loupeX"></g></svg></div>
 <div id="drop">SVG / PNG 파일을 놓으세요</div>
</div>
<aside>
 <h3>보정 (기준 단위)</h3>
 <div class="row"><label>1u =<input type="number" id="uIn" step="0.1"></label>단위 <span class="hint">(줄기 폭)</span></div>
 <div class="row"><label>원점 x<input type="number" id="oxIn" step="0.1"></label><label>y<input type="number" id="oyIn" step="0.1"></label></div>
 <div class="row"><label>귀 기준선 y<input type="number" id="refIn" step="0.1"></label></div>
 <div class="row"><button id="setU">마지막 거리를 1u로</button></div>
 <h3>오버레이</h3>
 <div class="row"><label><input type="checkbox" id="oGrid">1u 격자(+¼u)</label></div>
 <div class="row"><label><input type="checkbox" id="oRef" checked><span class="sw" style="background:#7c3aed"></span>귀 기준선(수평)</label></div>
 <div class="row"><label><input type="checkbox" id="oMeas"><span class="sw" style="background:var(--meas)"></span>측정된 귀 선 (ears.json)</label></div>
 <div class="row"><label><input type="checkbox" id="oStd"><span class="sw" style="background:var(--std)"></span>제안 표준 귀 선/각도</label></div>
 <div class="row"><label><input type="checkbox" id="oClear"><span class="sw" style="background:#16a34a"></span>여백 0.5u · 4.5×3.375u 박스</label></div>
 <div class="row"><label>로고 불투명도<input type="range" id="logoOp" min="0" max="1" step="0.05" value="1"></label></div>
 <div class="row"><label>오버레이 불투명도<input type="range" id="ovOp" min="0" max="1" step="0.05" value="0.9"></label></div>
 <div class="row"><label><input type="checkbox" id="snapOn" checked>윤곽점 스냅</label><label><input type="checkbox" id="unitTicks">자에 단위 눈금</label></div>
 <h3>도구</h3>
 <div class="row"><button id="proLeft">각도기 → 왼쪽 귀 밑동</button><button id="proRight">→ 오른쪽</button></div>
 <div class="row"><label>각도기 0° 회전<input type="number" id="proRot" step="0.1" value="0"></label>°</div>
 <div class="row"><label>자 길이<input type="number" id="rulerLen" step="0.25" value="2"></label>u <button id="rulerStem">줄기에 놓기</button></div>
 <div class="hint">자: 몸통 드래그=이동, ● 회전, ▶ 길이. 각도기: 중심 ✚ 드래그=이동, ◆ 0°선 회전, 바늘 끝 ● 드래그=각도 읽기 (0.1°). Shift = 15° 단위 고정. 빈 곳 드래그/Space+드래그 = 이동, 휠 = 확대.</div>
 <h3>규격 검사 <span class="hint" style="text-transform:none">(측정 vs 제안 표준)</span></h3>
 <div class="row"><label>허용 ±<input type="number" id="tolDeg" value="1" step="0.1">°</label><label>±<input type="number" id="tolU" value="0.02" step="0.005">u</label></div>
 <div id="spec"></div>
 <h3>측정 목록</h3>
 <div id="mlist"></div>
 <div class="row"><button id="csvBtn">CSV 내보내기</button><button id="clrBtn">모두 삭제</button></div>
</aside>
<footer><span id="coord">x – y –</span><span id="zoomTxt"></span><span id="modeTxt"></span></footer>
</div>

  if(drag.t=='r-len'){const c=Math.cos(ruler.a*D),s=Math.sin(ruler.a*D);let l=(w[0]-ruler.x)*c+(w[1]-ruler.y)*s;if(sh)l=Math.round(l/(L.u/4))*(L.u/4);ruler.len=Math.max(l,L.u/4);$('#rulerLen').value=fmt(ruler.len/L.u,3)}
  if(drag.t=='p-move'){let p=[drag.r0.x+w[0]-drag.w0[0],drag.r0.y+w[1]-drag.w0[1]];const sp=snap(p);pro.x=sp[0];pro.y=sp[1];cw=[pro.x,pro.y]}
  if(drag.t=='p-rot'){let a=ang(w[0]-pro.x,w[1]-pro.y);if(sh)a=Math.round(a/15)*15;pro.rot=+fmt(a,1);$('#proRot').value=pro.rot}
  if(drag.t=='p-arm'){let a=ang(w[0]-pro.x,w[1]-pro.y)-pro.rot;a=((a+180)%360+360)%360-180;if(sh)a=Math.round(a/15)*15;pro.arm=Math.round(a*10)/10;cw=w}
  if(drag.t=='p-size'){pro.R=Math.max(Math.hypot(w[0]-pro.x,w[1]-pro.y),40/view.k)}
  render();loupe(e,cw);return}
 if(mode){hover=snap(w);render();loupe(e,hover)}else{$('#loupe').style.display='none'}
});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(drag){drag=null;stage.classList.remove('panning');if(!mode)$('#loupe').style.display='none'}}
stage.addEventListener('pointerup',endPtr);stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('pointerleave',()=>{if(!drag)$('#loupe').style.display='none'});
function loupe(e,p){const lp=$('#loupe'),r=$('#stageWrap').getBoundingClientRect();lp.style.display='block';let lx=e.clientX-r.left+24,ly=e.clientY-r.top-174;if(ly<0)ly=e.clientY-r.top+24;if(lx+150>r.width)lx=e.clientX-r.left-174;lp.style.left=lx+'px';lp.style.top=ly+'px';
 const s=lp.querySelector('svg'),z=view.k*6,half=75/z;s.setAttribute('viewBox',`${p[0]-half} ${p[1]-half} ${2*half} ${2*half}`);
 $('#loupeX').innerHTML=`<line x1="${p[0]-half}" y1="${p[1]}" x2="${p[0]+half}" y2="${p[1]}" stroke="#e11d48" stroke-width="${1/z}"/><line x1="${p[0]}" y1="${p[1]-half}" x2="${p[0]}" y2="${p[1]+half}" stroke="#e11d48" stroke-width="${1/z}"/>${p[2]?`<circle cx="${p[0]}" cy="${p[1]}" r="${5/z}" fill="none" stroke="#16a34a" stroke-width="${1.5/z}"/>`:''}`}
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
// 키보드
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'&&e.target.type!='checkbox'&&e.target.type!='range')return;const k=e.key.toLowerCase();
 if(e.code=='Space'){spaceDown=true;stage.classList.add('pan');e.preventDefault();return}
 if(e.metaKey||e.ctrlKey)return;
 if(k=='r')toggleTool('ruler');else if(k=='p')toggleTool('pro');else if(k=='m')setMode('dist');else if(k=='a')setMode('angle');
 else if(k=='g'){st.grid=!st.grid;$('#oGrid').checked=st.grid;syncBtns();render()}else if(k=='f')fit();
 else if(k=='escape'){if(pending.length){pending=[];render()}else if(mode)setMode(mode)}});
addEventListener('keyup',e=>{if(e.code=='Space'){spaceDown=false;stage.classList.remove('pan')}});
function syncBtns(){$('#gridBtn').classList.toggle('on',st.grid)}

['oRef','oMeas','oStd','oClear','logoOp','ovOp','unitTicks','snapOn'].forEach(i=>$('#'+i).addEventListener('input',render));
['tolDeg','tolU'].forEach(i=>$('#'+i).oninput=renderSpec);

$('#oxIn').onchange=e=>{L.ox=+e.target.value;render()};$('#oyIn').onchange=e=>{L.oy=+e.target.value;render()};

$('#setU').onclick=()=>{const m=measures.filter(m=>m.logo==cur&&m.type=='dist').at(-1);if(!m)return alert('먼저 거리 측정(M)으로 줄기 폭을 재세요.');L.u=calc(m).d;$('#uIn').value=fmt(L.u,2);renderSpec();renderList();render()};
$('#fitBtn').onclick=fit;$('#zin').onclick=()=>{const [w,h]=size();zoomAt(1.25,w/2,h/2)};$('#zout').onclick=()=>{const [w,h]=size();zoomAt(0.8,w/2,h/2)};
$('#themeBtn').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'};

// 파일 열기
$('#openBtn').onclick=()=>$('#file').click();$('#file').onchange=e=>e.target.files[0]&&loadFile(e.target.files[0]);
const wrap=$('#stageWrap');wrap.addEventListener('dragover',e=>{e.preventDefault();$('#drop').style.display='flex'});wrap.addEventListener('dragleave',()=>$('#drop').style.display='none');
wrap.addEventListener('drop',e=>{e.preventDefault();$('#drop').style.display='none';const f=e.dataTransfer.files[0];if(f)loadFile(f)});
function loadFile(f){const rd=new FileReader();const isSvg=/svg/.test(f.type)||/\.svg$/i.test(f.name);
 rd.onload=()=>{const c={name:f.name,u:100,ears:null,ink:null,ref:null,ox:null,oy:null,extra:{}};
  if(isSvg){c.svg=rd.result;LOGOS.custom=c;$('#customTab').style.display='';$('#customTab').textContent=f.name;setLogo('custom');finish()}
  else{const im=new Image();im.onload=()=>{c.img=rd.result;c.W=im.naturalWidth;c.H=im.naturalHeight;c.vb=[0,0,c.W,c.H];c.ink=[0,0,c.W,c.H];LOGOS.custom=c;$('#customTab').style.display='';$('#customTab').textContent=f.name;setLogo('custom');finish()};im.src=rd.result}};
 function finish(){const L2=LOGOS.custom;if(!L2.u||L2.u==100){L2.u=Math.round((L2.ink[2]-L2.ink[0])/4.5*10)/10;$('#uIn').value=L2.u}}
 isSvg?rd.readAsText(f):rd.readAsDataURL(f)}
addEventListener('resize',()=>apply());
setLogo('symbol');
window.__T={get L(){return L},get pro(){return pro},get ruler(){return ruler},get view(){return view},measures,placePro,toggleTool,setMode,render,fit};
